[package]
name = "cosa"
version = "0.1.0"
edition = "2021"

[dependencies]
# Use rusqlite's generated bindings, but resolve SQLite from Android's
# system libsqlite.so at link/runtime instead of compiling an embedded copy.
rusqlite = { version = "0.32", default-features = false, features = ["modern_sqlite"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
